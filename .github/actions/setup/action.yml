name: Set up
description: Node from .nvmrc and the dependencies (npm ci), after actions/checkout.

inputs:
    chromium:
        description: Also install Chromium for Playwright (Storybook tests, smoke test).
        default: 'false'

runs:
    using: composite
    steps:
        - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
          with:
              node-version-file: .nvmrc
              cache: npm

        - name: Install dependencies
          shell: bash
          run: npm ci

        # Only the headless shell, which headless Chromium uses, and no system packages: the
        # runner image already has what it needs, and installing them (`--with-deps`) took most of
        # this step.
        - name: Install Chromium
          if: inputs.chromium == 'true'
          shell: bash
          run: npx playwright install --only-shell chromium
