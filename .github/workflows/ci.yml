name: CI

# Every check runs on every pull request, in parallel jobs, so that the wait is the longest job
# rather than the sum of them. `npm run verify` runs the same checks locally.
on:
    push:
        branches: [v5.x]
    pull_request:
        branches: [v5.x]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    lint:
        name: Format, lint and changeset
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - uses: ./.github/actions/setup

            - name: Check formatting
              run: npm run format:check

            - name: Lint
              run: npm run lint

            # "Version packages" pull requests consume the changesets instead of adding one: the
            # Release workflow opens them from changeset-release/* branches, and a maintainer may
            # open one by hand with that title.
            - name: Check for a changeset
              if: >-
                  github.event_name == 'pull_request' &&
                  !startsWith(github.head_ref, 'changeset-release/') &&
                  !startsWith(github.event.pull_request.title, 'Version packages')
              run: npx changeset status --since=origin/${{ github.base_ref }}

    typecheck:
        name: Typecheck
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v5

            - uses: ./.github/actions/setup

            - name: Typecheck
              run: |
                  npx tsc -p tsconfig.json
                  npm run typecheck

    test:
        name: Test
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v5

            - uses: ./.github/actions/setup

            - name: Test
              run: npm test

    build:
        name: Build and API reports
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v5

            - uses: ./.github/actions/setup

            - name: Build
              run: npm run build

            # With the declarations of the build, rather than `npm run api:check`, which emits
            # them again.
            - name: Check the API reports
              run: node scripts/api-report.js --workspaces --check

    template:
        name: Package template
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v5

            - uses: ./.github/actions/setup

            - name: Check the package template
              run: npm run test:create-package

    storybook:
        name: Storybook (interactions and accessibility)
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v5

            - uses: ./.github/actions/setup
              with:
                  chromium: true

            - name: Run the stories as tests, with axe checks
              run: npm run test:storybook

            - name: Build Storybook
              run: npm run build-storybook -- --quiet

    smoke-webpack:
        name: Smoke test (packed packages in a webpack app, and their types under NodeNext)
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v5

            - uses: ./.github/actions/setup
              with:
                  chromium: true

            - name: Build the packages
              run: npm run build

            - name: Pack, install and build with flklr (webpack), then render in Chromium
              run: npm run test:smoke

            - name: Pack, install and typecheck every entry point under NodeNext
              run: npm run test:types
