name: CI

# The checks run in parallel jobs, so that the wait is the longest job rather than the sum of them.
# `npm run verify` runs the same checks locally. See docs/ci.md.
#
# Pushes to v5.x and the merge queue (`merge_group`) run everything. Pull requests run the unit
# tests and the stories of the packages they change and of the packages that depend on them
# (scripts/affected.js), or everything when they change something shared.
on:
    push:
        branches: [v5.x]
    pull_request:
        branches: [v5.x]
    merge_group:
        types: [checks_requested]

# A new push to a pull request cancels its run. Runs of v5.x and of the merge queue always finish:
# each commit of v5.x keeps its result, and the queue waits for every group it tests.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    lint:
        name: Format, lint and changeset
        runs-on: ubuntu-24.04
        steps:
            # The changeset check needs the history of the base branch, on pull requests only.
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
              with:
                  fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

            - uses: ./.github/actions/setup

            - name: Check formatting
              run: npm run format:check

            - name: Check the status of decisions
              run: node scripts/verify.js --decisions

            - name: Lint
              run: npm run lint

            # "Version packages" pull requests consume the changesets instead of adding one: the
            # Release workflow opens them from changeset-release/* branches, and a maintainer may
            # open one by hand with that title. Only on pull requests: v5.x and the merge queue
            # (`merge_group`) have no pull request to read, and each pull request they contain
            # passed this check already.
            - name: Check for a changeset
              if: >-
                  github.event_name == 'pull_request' &&
                  !startsWith(github.head_ref, 'changeset-release/') &&
                  !startsWith(github.event.pull_request.title, 'Version packages')
              run: npx changeset status --since=origin/${{ github.base_ref }}

    typecheck:
        name: Typecheck
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

            - uses: ./.github/actions/setup

            - name: Typecheck
              run: |
                  npx tsc -p tsconfig.json
                  npm run typecheck

    test:
        name: Test
        runs-on: ubuntu-24.04
        steps:
            # On pull requests, the checkout is the merge commit, whose first parent is v5.x.
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
              with:
                  fetch-depth: 2

            # With the Node of the runner, before the setup, so that a pull request that changes
            # no package skips the rest.
            - name: Select the packages to test
              id: affected
              if: github.event_name == 'pull_request'
              run: node scripts/affected.js --base HEAD^1 --target test --github

            - uses: ./.github/actions/setup
              if: steps.affected.outputs.run != 'false'

            - name: Test
              if: steps.affected.outputs.run != 'false'
              env:
                  FILTERS: ${{ steps.affected.outputs.filters }}
              run: |
                  read -ra filters <<< "$FILTERS"
                  npm test -- --passWithNoTests "${filters[@]}"

    # Storybook's build is here rather than in the Storybook job, which is the longest.
    build:
        name: Build, API reports and Storybook build
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

            - uses: ./.github/actions/setup

            - name: Build
              run: npm run build

            # With the declarations of the build, rather than `npm run api:check`, which emits
            # them again.
            - name: Check the API reports
              run: node scripts/api-report.js --workspaces --check

            - name: Build Storybook
              run: npm run build-storybook -- --quiet

    template:
        name: Package template
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

            - uses: ./.github/actions/setup

            - name: Check the package template
              run: npm run test:create-package

    storybook:
        name: Storybook (interactions and accessibility)
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
              with:
                  fetch-depth: 2

            - name: Select the packages to test
              id: affected
              if: github.event_name == 'pull_request'
              run: node scripts/affected.js --base HEAD^1 --target storybook --github

            - uses: ./.github/actions/setup
              if: steps.affected.outputs.run != 'false'
              with:
                  chromium: true

            - name: Run the stories as tests, with axe checks
              if: steps.affected.outputs.run != 'false'
              env:
                  FILTERS: ${{ steps.affected.outputs.filters }}
              run: |
                  read -ra filters <<< "$FILTERS"
                  npm run test:storybook -- --project storybook --passWithNoTests "${filters[@]}"

    # The same stories in the dark scheme and the touch density, in their own job so that the wait
    # stays the longest job.
    storybook-dark-touch:
        name: Storybook (dark scheme, touch density)
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
              with:
                  fetch-depth: 2

            - name: Select the packages to test
              id: affected
              if: github.event_name == 'pull_request'
              run: node scripts/affected.js --base HEAD^1 --target storybook --github

            - uses: ./.github/actions/setup
              if: steps.affected.outputs.run != 'false'
              with:
                  chromium: true

            - name: Run the stories as tests in the dark scheme and the touch density, with axe checks
              if: steps.affected.outputs.run != 'false'
              env:
                  FILTERS: ${{ steps.affected.outputs.filters }}
              run: |
                  read -ra filters <<< "$FILTERS"
                  npm run test:storybook -- --project storybook-dark-touch --passWithNoTests "${filters[@]}"

    smoke-webpack:
        name: Smoke tests (webpack app, types under NodeNext, icons and size of Vite bundles)
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

            - uses: ./.github/actions/setup
              with:
                  chromium: true

            - name: Build the packages
              run: npm run build

            - name: Pack, install and build with flklr (webpack), then render in Chromium
              run: npm run test:smoke

            - name: Pack, install and typecheck every entry point under NodeNext
              run: npm run test:types

            - name: Lucide icons only in the bundles of apps that use them (Vite)
              run: npm run test:icons

            - name: Initial JavaScript of a minimal app within its budget (Vite)
              run: npm run test:bundle-size
