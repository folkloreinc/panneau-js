name: CI

on:
    push:
        branches: [v5.x]
    pull_request:
        branches: [v5.x]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    ci:
        name: Lint, typecheck, test and build
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v5
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Check formatting
              run: npm run format:check

            - name: Lint
              run: npm run lint

            - name: Typecheck
              run: |
                  npx tsc -p tsconfig.json
                  npm run typecheck

            - name: Test
              run: npm test

            - name: Build
              run: npm run build

            - name: Check the API reports
              run: npm run api:check

            - name: Check the package template
              run: npm run test:create-package

            - name: Check for a changeset
              if: github.event_name == 'pull_request'
              run: npx changeset status --since=origin/${{ github.base_ref }}

    storybook:
        name: Storybook (interactions and accessibility)
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Install Chromium
              run: npx playwright install --with-deps chromium

            - name: Run the stories as tests, with axe checks
              run: npm run test:storybook

            - name: Build Storybook
              run: npm run build-storybook -- --quiet

    smoke-webpack:
        name: Smoke test (packed packages in a webpack app)
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Install Chromium
              run: npx playwright install --with-deps chromium

            - name: Build the packages
              run: npm run build

            - name: Pack, install and build with flklr (webpack), then render in Chromium
              run: npm run test:smoke
