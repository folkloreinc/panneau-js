name: Release

# Runs on every push to v5.x:
# - with pending changesets, it opens (or updates) the "Version packages" pull request, and
#   publishes nothing;
# - without pending changesets, which is the case right after that pull request is merged, it
#   publishes the versions that are not on npm yet (dist-tag `alpha` while v5.x is in pre-release
#   mode) and tags them. When everything is already published, it does nothing.
# Merging the "Version packages" pull request is what releases.
on:
    push:
        branches: [v5.x]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

permissions:
    contents: write
    pull-requests: write
    id-token: write

jobs:
    release:
        name: Version or publish
        if: github.repository == 'folkloreinc/panneau-js' && github.ref == 'refs/heads/v5.x'
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version-file: .nvmrc
                  cache: npm
                  registry-url: https://registry.npmjs.org

            - name: Install dependencies
              run: npm ci

            # v2 is the first version that reads changesets 3 (its pre-release state lives in
            # .changeset/pre/). npm authenticates through trusted publishing (id-token).
            - uses: changesets/action@v2
              with:
                  version-script: npm run version-packages
                  publish-script: npm run release
                  pr-title: Version packages
                  commit-message: Version packages
                  github-token: ${{ secrets.GITHUB_TOKEN }}
              env:
                  NPM_CONFIG_PROVENANCE: true
