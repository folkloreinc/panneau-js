name: Release

# Runs on every push to v5.x:
# - with pending changesets, it opens (or updates) the "Version packages" pull request, and
#   publishes nothing;
# - without pending changesets, which is the case right after that pull request is merged, it
#   publishes the versions that are not on npm yet (dist-tag `alpha` while v5.x is in pre-release
#   mode) and tags them. When everything is already published, it does nothing.
# Merging the "Version packages" pull request is what releases.
on:
    push:
        branches: [v5.x]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

permissions:
    contents: write
    pull-requests: write
    id-token: write

jobs:
    release:
        name: Version or publish
        if: github.repository == 'folkloreinc/panneau-js' && github.ref == 'refs/heads/v5.x'
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version-file: .nvmrc
                  cache: npm
                  registry-url: https://registry.npmjs.org

            - name: Install dependencies
              run: npm ci

            # Checks that npm accepts the OIDC token of this workflow for trusted publishing. When it
            # doesn't, npm only logs the reason at the verbose level, falls back to the placeholder
            # token of setup-node and fails with a 404, and changesets doesn't show npm's logs. This
            # step prints the claims npm matches against the trusted publisher, and npm's answer
            # without the token it may return.
            - name: Check npm trusted publishing
              continue-on-error: true
              run: |
                  id_token=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                      "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r '.value')
                  echo "::add-mask::$id_token"
                  ID_TOKEN="$id_token" node -e '
                      const claims = JSON.parse(Buffer.from(process.env.ID_TOKEN.split(".")[1], "base64url"));
                      const { repository, ref, workflow_ref, job_workflow_ref, environment, event_name } = claims;
                      console.log("Claims:", JSON.stringify({ repository, ref, workflow_ref, job_workflow_ref, environment, event_name }));'
                  status=$(curl -sS -o exchange.json -w '%{http_code}' -X POST \
                      -H "Authorization: Bearer $id_token" \
                      https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@panneau%2fintl)
                  token=$(jq -r '.token // empty' exchange.json)
                  if [ -n "$token" ]; then echo "::add-mask::$token"; fi
                  echo "Token exchange for @panneau/intl: HTTP $status $(jq -c 'del(.token)' exchange.json)"
                  rm exchange.json

            # v2 is the first version that reads changesets 3 (its pre-release state lives in
            # .changeset/pre/). npm authenticates through trusted publishing (id-token).
            - uses: changesets/action@v2
              with:
                  version-script: npm run version-packages
                  publish-script: npm run release
                  pr-title: Version packages
                  commit-message: Version packages
                  github-token: ${{ secrets.GITHUB_TOKEN }}
              env:
                  NPM_CONFIG_PROVENANCE: true
