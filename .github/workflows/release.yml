name: Release

# Runs on every push to v5.x:
# - with pending changesets, it opens (or updates) the "Version packages" pull request, and
#   publishes nothing;
# - without pending changesets, which is the case right after that pull request is merged, it
#   publishes the versions that are not on npm yet (dist-tag `alpha` while v5.x is in pre-release
#   mode) and tags them. When everything is already published, it does nothing.
# Merging the "Version packages" pull request is what releases.
on:
    push:
        branches: [v5.x]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

permissions:
    contents: write
    pull-requests: write
    id-token: write

jobs:
    release:
        name: Version or publish
        if: github.repository == 'folkloreinc/panneau-js' && github.ref == 'refs/heads/v5.x'
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version-file: .nvmrc
                  cache: npm
                  registry-url: https://registry.npmjs.org

            - name: Install dependencies
              run: npm ci

            - uses: changesets/action@v1
              with:
                  version: npm run version-packages
                  publish: npm run release
                  title: Version packages
                  commit: Version packages
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NPM_CONFIG_PROVENANCE: true
